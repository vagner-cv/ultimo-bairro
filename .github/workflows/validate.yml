name: Validate and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_* /tmp/godot/godot
      - name: Prepare licensed free artwork
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-tools.txt
          .venv/bin/python tools/prepare_assets.py
      - name: Import assets
        run: godot --headless --path . --editor --import --quit
      - name: Test gameplay
        run: |
          godot --headless --path . --fixed-fps 60 --script res://tests/run_tests.gd 2>&1 | tee /tmp/ultimo-bairro-tests.log
          ! grep -Eq '^SCRIPT ERROR:|^ERROR:' /tmp/ultimo-bairro-tests.log

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_* /tmp/godot/godot
      - name: Download PC release templates
        run: python3 tools/fetch_export_templates.py --destination "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Prepare licensed free artwork
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-tools.txt
          .venv/bin/python tools/prepare_assets.py
      - name: Export Windows and Linux
        run: |
          .venv/bin/python tools/build.py
          git archive --format=zip --prefix=ultimo-bairro/ --output=builds/UltimoBairro-0.2.0-Codigo.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: UltimoBairro-Windows
          path: builds/windows/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: UltimoBairro-Linux
          path: builds/linux/
          retention-days: 14
      - name: Publish tagged PC release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Último Bairro ${GITHUB_REF_NAME}" --notes-file docs/RELEASE-0.2.0.md
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber builds/UltimoBairro-0.2.0-Windows.zip builds/UltimoBairro-0.2.0-Linux.zip builds/UltimoBairro-0.2.0-Codigo.zip
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
